# Fee-management accepts custom student session tokens in the request body.
# Admin/Principal actions still enforce Supabase Auth inside the database RPCs.
[functions.fee-management]
verify_jwt = false

# Scheduled fee reminders authenticate with the dedicated FEE_REMINDER_CRON_SECRET header.
[functions.fee-reminders]
verify_jwt = false

# Portal passkeys support student passkey login before a Supabase Auth session exists.
# The Edge Function enforces active Admin authorization or a verified student session itself.
[functions.portal-passkeys]
verify_jwt = false

# Admin users authenticate through Supabase Auth passkeys. The relying-party
# origin for native Android builds must also include each app signing
# certificate's android:apk-key-hash origin in the project Auth settings.
[auth.passkey]
enabled = true

[auth.webauthn]
rp_display_name = "Ashiana Public School"
rp_id = "erskgaur2008-arch.github.io"
rp_origins = ["https://erskgaur2008-arch.github.io"]
