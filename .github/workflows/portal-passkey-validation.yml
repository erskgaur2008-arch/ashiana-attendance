name: Admin and Student Passkey Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'portal-passkey-lock.js'
      - '.github/scripts/**'
      - 'index.html'
      - 'mobile/native-bridge.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/functions/portal-passkeys/**'
      - 'supabase/migrations/20261027000200_admin_student_portal_passkeys.sql'
      - 'supabase/config.toml'
      - '.github/workflows/portal-passkey-validation.yml'
  push:
    branches: [main]
    paths:
      - 'portal-passkey-lock.js'
      - '.github/scripts/**'
      - 'index.html'
      - 'mobile/native-bridge.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/functions/portal-passkeys/**'
      - 'supabase/migrations/20261027000200_admin_student_portal_passkeys.sql'
      - 'supabase/config.toml'
      - '.github/workflows/portal-passkey-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate passkey code and security boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check JavaScript syntax
        run: python .github/scripts/check-inline-javascript.py
      - name: Type-check portal passkeys Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/portal-passkeys/index.ts
      - name: Validate migration SQL syntax
        run: |
          python -m pip install --disable-pip-version-check pglast
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          path = Path("supabase/migrations/20261027000200_admin_student_portal_passkeys.sql")
          parse_sql(path.read_text(encoding="utf-8"))
          print("Passkey migration SQL syntax OK")
          PY
      - name: Check Admin, Student, Android, and database security wiring
        run: python .github/scripts/check-passkey-wiring.py
