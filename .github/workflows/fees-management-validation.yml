name: Fees Management Draft Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/fee-management/**'
      - 'supabase/migrations/20261023000*_fees_management_*.sql'
      - 'supabase/tests/fees_management_security.sql'
      - 'index.html'
      - '.github/workflows/fees-management-validation.yml'
  push:
    branches: [feat/live-fees-management]
    paths:
      - 'supabase/functions/fee-management/**'
      - 'supabase/migrations/20261023000*_fees_management_*.sql'
      - 'supabase/tests/fees_management_security.sql'
      - 'index.html'
      - '.github/workflows/fees-management-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check fee management Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install function dependencies
        run: deno install --entrypoint supabase/functions/fee-management/index.ts
      - name: Type-check Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/fee-management/index.ts
      - name: Check migration and test files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/20261023000100_fees_management_schema.sql
          test -s supabase/migrations/20261023000200_fees_management_security.sql
          test -s supabase/migrations/20261023000300_fees_management_storage.sql
          test -s supabase/migrations/20261023000400_fees_management_admin_setup.sql
          test -s supabase/config.toml
          grep -q 'verify_jwt = false' supabase/config.toml
          test -s supabase/tests/fees_management_security.sql
          grep -q "studentDashboardSection('fees')" index.html
          grep -q "submitStudentFeePayment" index.html
          grep -q "openFeesAdminConsole" index.html
          grep -q "student-submissions" supabase/functions/fee-management/index.ts
          grep -q "admin-discount-queue" supabase/functions/fee-management/index.ts
          grep -q "fee_admin_search_students" supabase/migrations/20261023000400_fees_management_admin_setup.sql
          grep -q "fee_admin_discount_queue" supabase/migrations/20261023000200_fees_management_security.sql
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const source = match[1];
            if (!source.trim()) continue;
            try { new Function(source); checked++; }
            catch (error) {
              console.error(`Inline script ${index + 1} syntax error: ${error.message}`);
              process.exit(1);
            }
          }
          if (checked === 0) throw new Error('No inline scripts were checked');
          console.log(`Parsed ${checked} inline scripts successfully`);
          NODE
          echo "Draft source checks passed. This workflow does not apply migrations or access production."
