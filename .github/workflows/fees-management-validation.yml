name: Fees Management Draft Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/fee-management/**'
      - 'supabase/migrations/20261023000*_fees_management_*.sql'
      - 'supabase/tests/fees_management_security.sql'
      - '.github/workflows/fees-management-validation.yml'
  push:
    branches: [feat/live-fees-management]
    paths:
      - 'supabase/functions/fee-management/**'
      - 'supabase/migrations/20261023000*_fees_management_*.sql'
      - 'supabase/tests/fees_management_security.sql'
      - '.github/workflows/fees-management-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check fee management Edge Function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install function dependencies
        run: deno install --entrypoint supabase/functions/fee-management/index.ts
      - name: Type-check Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/fee-management/index.ts
      - name: Check migration and test files exist
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/migrations/20261023000100_fees_management_schema.sql
          test -s supabase/migrations/20261023000200_fees_management_security.sql
          test -s supabase/migrations/20261023000300_fees_management_storage.sql
          test -s supabase/migrations/20261023000400_fees_management_admin_setup.sql
          test -s supabase/tests/fees_management_security.sql
          echo "Draft files are present. This workflow does not apply migrations or access production."
