name: Build Ashiana Attendance APK

on:
  # APK builds are now manual only.
  # Web/website pushes will no longer start an APK build automatically.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web bundle
        shell: bash
        run: |
          set -e
          rm -rf mobile/www
          mkdir -p mobile/www/assets/vendor
          cp index.html mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor/. mobile/www/assets/vendor
          test -f mobile/www/index.html
          test -s mobile/www/assets/vendor/supabase.js

      - name: Install Capacitor
        shell: bash
        run: |
          set -e
          # The repository currently has no committed lockfile. Generate one
          # in the runner so the install step is explicit and the build can
          # continue for browser-only maintainers. Commit package-lock.json
          # later to make dependency resolution reproducible between builds.
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Bundle native Android print and file bridge
        shell: bash
        run: |
          set -e
          mkdir -p mobile/www/assets/vendor
          npx esbuild mobile/native-bridge.js --bundle --format=iife --platform=browser --target=es2020 --outfile=mobile/www/assets/vendor/ashiana-native-bridge.js
          test -s mobile/www/assets/vendor/ashiana-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          script = anchor + '\n  <script src="./assets/vendor/ashiana-native-bridge.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find the expected script insertion point in the Android web bundle")
          path.write_text(html.replace(anchor, script, 1))
          PY

      - name: Verify Capacitor environment
        run: npx cap doctor

      - name: Add Android platform
        run: npx cap add android

      - name: Apply school logo to legacy and adaptive Android app icons
        shell: bash
        run: |
          set -e
          command -v convert >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y imagemagick
          }

          SRC="logo 2.png"
          RES="android/app/src/main/res"
          test -s "$SRC"

          # Legacy launcher icons for older Android launchers.
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${spec%%:*}"
            SIZE="${spec##*:}"
            mkdir -p "$RES/$DIR"
            convert "$SRC" -resize "${SIZE}x${SIZE}" -gravity center -background white -alpha remove -alpha off -extent "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher.png"
            cp "$RES/$DIR/ic_launcher.png" "$RES/$DIR/ic_launcher_round.png"
          done

          # Adaptive icons are used by modern Android launchers. Keep the logo
          # centered with safe padding so it is not cropped by circular/squircle masks.
          for spec in "mipmap-mdpi:108" "mipmap-hdpi:162" "mipmap-xhdpi:216" "mipmap-xxhdpi:324" "mipmap-xxxhdpi:432"; do
            DIR="${spec%%:*}"
            SIZE="${spec##*:}"
            mkdir -p "$RES/$DIR"
            convert "$SRC" -resize "$((SIZE * 68 / 100))x$((SIZE * 68 / 100))" -gravity center -background none -extent "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher_foreground.png"
          done

          mkdir -p "$RES/mipmap-anydpi-v26"
          # Capacitor's generated Android project already defines
          # ic_launcher_background in res/values. Do not create a second
          # resource with the same name under res/color (Android merges both
          # folders into the same resource namespace).
          rm -f "$RES/color/ic_launcher_background.xml"
          test -s "$RES/values/ic_launcher_background.xml"

          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF

          # Round adaptive icon uses the same school logo and background.
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"

          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"
          test -s "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png"
          test -s "$RES/mipmap-anydpi-v26/ic_launcher.xml"

      - name: Sync web assets
        run: npx cap sync android

      - name: Declare Android camera permission
        shell: bash
        run: |
          set -e
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          test -s "$MANIFEST"
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          permission = '    <uses-permission android:name="android.permission.CAMERA" />'
          if 'android.permission.CAMERA' not in xml:
              match = re.search(r'<manifest\b[^>]*>', xml)
              if not match:
                  raise SystemExit("Could not locate manifest root element")
              xml = xml[:match.end()] + "\n" + permission + xml[match.end():]
              path.write_text(xml)
          if 'android.permission.CAMERA' not in path.read_text():
              raise SystemExit("Camera permission was not added")
          print("Android CAMERA permission is declared.")
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ashiana-attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
