name: Build Ashiana Attendance APKs

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'portal-passkey-lock.js'
      - 'mobile/native-bridge.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/vendor/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'portal-passkey-lock.js'
      - 'mobile/native-bridge.js'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'assets/vendor/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build ${{ matrix.role }} APK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: admin
            label: Ashiana-Admin
          - role: staff
            label: Ashiana-Staff
          - role: student
            label: Ashiana-Student
    env:
      APP_ROLE: ${{ matrix.role }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare role-specific web bundle
        shell: bash
        run: |
          set -e
          rm -rf mobile/www
          mkdir -p mobile/www/assets/vendor
          cp index.html mobile/www/
          cp portal-passkey-lock.js mobile/www/
          cp ios-pwa.css mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor/. mobile/www/assets/vendor
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          role = os.environ["APP_ROLE"]
          anchor = '  <script src="./assets/vendor/supabase.js" defer></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find expected Supabase script insertion point")
          additions = anchor + '\n  <script>try{const u=new URL(window.location.href);u.searchParams.set("login","' + role + '");history.replaceState(null,"",u.toString());}catch(e){}</script>'
          path.write_text(html.replace(anchor, additions, 1))
          PY
          test -s mobile/www/assets/vendor/supabase.js
      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund
      - name: Bundle Android native print and file bridge
        shell: bash
        run: |
          set -e
          npx esbuild mobile/native-bridge.js --bundle --format=iife --platform=browser --target=es2020 --outfile=mobile/www/assets/vendor/ashiana-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js" defer></script>'
          bridge = '  <script src="./assets/vendor/ashiana-native-bridge.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find expected script insertion point")
          path.write_text(html.replace(anchor, anchor + '\n' + bridge, 1))
          PY
      - name: Verify Capacitor environment
        run: npx cap doctor
      - name: Add Android platform
        run: npx cap add android
      - name: Apply school logo to Android icons
        shell: bash
        run: |
          set -e
          command -v convert >/dev/null 2>&1 || { sudo apt-get update; sudo apt-get install -y imagemagick; }
          SRC="logo 2.png"
          RES="android/app/src/main/res"
          test -s "$SRC"
          for spec in "mipmap-mdpi:48" "mipmap-hdpi:72" "mipmap-xhdpi:96" "mipmap-xxhdpi:144" "mipmap-xxxhdpi:192"; do
            DIR="${spec%%:*}"; SIZE="${spec##*:}"; mkdir -p "$RES/$DIR"
            convert "$SRC" -resize "${SIZE}x${SIZE}" -gravity center -background white -alpha remove -alpha off -extent "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher.png"
            cp "$RES/$DIR/ic_launcher.png" "$RES/$DIR/ic_launcher_round.png"
          done
          for spec in "mipmap-mdpi:108" "mipmap-hdpi:162" "mipmap-xhdpi:216" "mipmap-xxhdpi:324" "mipmap-xxxhdpi:432"; do
            DIR="${spec%%:*}"; SIZE="${spec##*:}"; mkdir -p "$RES/$DIR"
            convert "$SRC" -resize "$((SIZE * 68 / 100))x$((SIZE * 68 / 100))" -gravity center -background none -extent "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          rm -f "$RES/color/ic_launcher_background.xml"
          test -s "$RES/values/ic_launcher_background.xml"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp "$RES/mipmap-anydpi-v26/ic_launcher.xml" "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
      - name: Configure Firebase Cloud Messaging when credentials are supplied
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -e
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not configured. APK will build, but Android push-token registration will not work until Firebase app configuration is added."
            exit 0
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          config = Path("android/app/google-services.json")
          parsed = json.loads(config.read_text())
          if not parsed.get("project_info", {}).get("project_id"):
              raise SystemExit("GOOGLE_SERVICES_JSON is missing project_info.project_id")
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"buildscript\s*\{[\s\S]*?dependencies\s*\{", root_text)
              if not match:
                  raise SystemExit("Could not find the Android buildscript dependencies block for Google Services")
              root_text = root_text[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[match.end():]
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Declare Android camera and location permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text()
          match = re.search(r'<manifest\b[^>]*>', xml)
          if not match:
              raise SystemExit("Could not locate manifest root element")
          permissions = [
              "android.permission.CAMERA",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
          ]
          missing = [p for p in permissions if p not in xml]
          if missing:
              declarations = "\n".join(f'    <uses-permission android:name="{p}" />' for p in missing)
              xml = xml[:match.end()] + "\n" + declarations + xml[match.end():]
              path.write_text(xml)
          final_xml = path.read_text()
          for permission in permissions:
              if permission not in final_xml:
                  raise SystemExit(f"Required Android permission missing: {permission}")
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.label }}.apk"
      - name: Upload role-specific APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.label }}-APK
          path: ${{ matrix.label }}.apk
          if-no-files-found: error
          retention-days: 30
