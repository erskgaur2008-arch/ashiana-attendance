name: Build Ashiana Attendance APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.webmanifest"
      - "sw.js"
      - "logo 2.png"
      - "capacitor.config.ts"
      - "package.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare web bundle
        shell: bash
        run: |
          set -e
          rm -rf mobile/www
          mkdir -p mobile/www
          cp index.html mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor mobile/www/assets/vendor
          test -f mobile/www/index.html
          test -s mobile/www/assets/vendor/supabase.js

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Verify Capacitor environment
        run: npx cap doctor

      - name: Add Android platform
        run: npx cap add android

      - name: Apply school logo as Android app icon
        shell: bash
        run: |
          set -e
          command -v convert >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y imagemagick
          }

          SRC="logo 2.png"
          RES="android/app/src/main/res"

          for spec in             "mipmap-mdpi:48"             "mipmap-hdpi:72"             "mipmap-xhdpi:96"             "mipmap-xxhdpi:144"             "mipmap-xxxhdpi:192"
          do
            DIR="${spec%%:*}"
            SIZE="${spec##*:}"
            mkdir -p "$RES/$DIR"
            convert "$SRC" -resize "${SIZE}x${SIZE}" -gravity center -background none -extent "${SIZE}x${SIZE}" "$RES/$DIR/ic_launcher.png"
            cp "$RES/$DIR/ic_launcher.png" "$RES/$DIR/ic_launcher_round.png"
          done

          test -s "$RES/mipmap-xxxhdpi/ic_launcher.png"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ashiana-attendance-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
