name: EduPunch-Test Admin APK
# Test-only workflow: changes on this branch trigger an isolated EduPunch-Test build.

on:
  workflow_dispatch:
  push:
    branches:
      - test/edupunch-test-admin-apk

permissions:
  contents: read

jobs:
  build-edupunch-test-admin:
    name: Build isolated EduPunch-Test Admin APK
    runs-on: ubuntu-latest
    env:
      APP_ROLE: admin
      TEST_SUPABASE_URL: https://goztsnvscanozcfjzwxy.supabase.co
      TEST_SUPABASE_ANON_KEY: sb_publishable_bLByB1N3ESh_5ncJ-yh3_Q_DkBpoGHh
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare admin-only web bundle and force test backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/assets/vendor
          cp index.html mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor/. mobile/www/assets/vendor
          cat > /tmp/prepare_test_admin.py <<'PYTHON_SCRIPT'
          import os
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          role = os.environ["APP_ROLE"]
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find expected Supabase script insertion point")
          additions = anchor + '\\n  <script>try{const u=new URL(window.location.href);u.searchParams.set("login","' + role + '");history.replaceState(null,"",u.toString());}catch(e){}</script>'
          html = html.replace(anchor, additions, 1)
          html = html.replace("https://oalfzgluqroqbbrulhpr.supabase.co", os.environ["TEST_SUPABASE_URL"])
          html = html.replace("sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg", os.environ["TEST_SUPABASE_ANON_KEY"])
          html = html.replace("sb-oalfzgluqroqbbrulhpr-auth-token", "sb-goztsnvscanozcfjzwxy-auth-token")
          html = html.replace("oalfzgluqroqbbrulhpr", "EduPunch-Test")
          import re
          old_pin_pattern = r"(?m)^[ \\t]*const result = await invokeAdminFunction\\('reset-staff-pin', \\{ staff_id: staff\\.id, pin: newPin \\}\\);"
          new_pin_call = """        if (!supabaseClient) throw new Error("Test database session is unavailable. Please sign in again.");
                const { data, error } = await supabaseClient.rpc('set_staff_pin', {
                  p_staff_id: staff.id,
                  p_pin: newPin
                });
                if (error) throw error;
                if (data !== true) throw new Error("PIN reset was not authorized for this account.");"""
          html, pin_call_count = re.subn(old_pin_pattern, lambda match: new_pin_call, html)
          if pin_call_count != 1:
              raise SystemExit(f"Safety check failed: expected one admin PIN reset Edge Function call, found {pin_call_count}")
          if "invokeAdminFunction('reset-staff-pin'" in html:
              raise SystemExit("Safety check failed: old reset-staff-pin Edge Function call remains in test APK")
          if "supabaseClient.rpc('set_staff_pin'" not in html:
              raise SystemExit("Safety check failed: test PIN reset RPC was not injected")
          forbidden = ["oalfzgluqroqbbrulhpr.supabase.co", "sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg", "sb-oalfzgluqroqbbrulhpr-auth-token"]
          leftovers = [value for value in forbidden if value in html]
          if leftovers:
              raise SystemExit("Safety check failed: production backend identifier remains: " + ", ".join(leftovers))
          if os.environ["TEST_SUPABASE_URL"] not in html or os.environ["TEST_SUPABASE_ANON_KEY"] not in html:
              raise SystemExit("Safety check failed: EduPunch-Test Supabase configuration was not injected")
          if "sb-goztsnvscanozcfjzwxy-auth-token" not in html:
              raise SystemExit("Safety check failed: test-specific auth storage key was not injected")
          if not Path("mobile/www/assets/vendor/supabase.js").is_file():
              raise SystemExit("Supabase client bundle is missing")
          path.write_text(html)
          print("Safety check passed: EduPunch-Test backend and auth namespace configured.")
          PYTHON_SCRIPT
          python3 /tmp/prepare_test_admin.py
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Bundle Android native bridge
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild mobile/native-bridge.js --bundle --format=iife --platform=browser --target=es2020 --outfile=mobile/www/assets/vendor/ashiana-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          bridge = '  <script src="./assets/vendor/ashiana-native-bridge.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find expected script insertion point")
          path.write_text(html.replace(anchor, anchor + '\n' + bridge, 1))
          PY

      - name: Verify Capacitor environment
        run: npx cap doctor

      - name: Add Android platform
        run: npx cap add android

      - name: Set unique test Android application ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("capacitor.config.ts")
          source = path.read_text()
          old = 'admin: { appId: "com.ashianapublicschool.attendance.admin", appName: "Ashiana Admin" }'
          new = 'admin: { appId: "com.ashianapublicschool.attendance.admin.test", appName: "Ashiana Admin Test" }'
          if source.count(old) != 1:
              raise SystemExit("Expected student app ID mapping was not found exactly once")
          path.write_text(source.replace(old, new, 1))
          if "com.ashianapublicschool.attendance.admin.test" not in path.read_text():
              raise SystemExit("Test package ID was not applied")
          print("Configured unique test-only package ID.")
          PY

      - name: Configure Firebase Cloud Messaging
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is required for this isolated notification test. No APK will be built."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          if not project_id:
              raise SystemExit("Firebase config is missing project_info.project_id")
          if "com.ashianapublicschool.attendance.admin.test" not in package_names:
              raise SystemExit("Firebase config does not include the test admin APK package name")
          print("Firebase config validated for the admin test package.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"buildscript\s*\{[\s\S]*?dependencies\s*\{", root_text)
              if not match:
                  raise SystemExit("Could not find Android buildscript dependencies block")
              root_text = root_text[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[match.end():]
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EduPunch-Test-Admin-APK.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: EduPunch-Test-Admin-APK
          path: EduPunch-Test-Admin-APK.apk
          if-no-files-found: error
          retention-days: 7
