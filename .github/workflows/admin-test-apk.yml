name: Admin Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/staff-geofence-50m

permissions:
  contents: read

jobs:
  build-admin-test:
    name: Build isolated Admin test APK
    runs-on: ubuntu-latest
    env:
      APP_ROLE: admin
      TEST_SUPABASE_URL: https://goztsnvscanozcfjzwxy.supabase.co
      TEST_SUPABASE_ANON_KEY: sb_publishable_bLByB1N3ESh_5ncJ-yh3_Q_DkBpoGHh
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare isolated test web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/assets/vendor
          cp index.html mobile/www/
          cp portal-passkey-lock.js mobile/www/
          cp ios-pwa.css mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor/. mobile/www/assets/vendor
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find the expected Supabase script anchor")
          role_script = '<script>try{const u=new URL(window.location.href);u.searchParams.set("login","admin");history.replaceState(null,"",u.toString());}catch(e){}</script>'
          html = html.replace(anchor, anchor + '\n' + role_script, 1)
          html = html.replace("https://oalfzgluqroqbbrulhpr.supabase.co", os.environ["TEST_SUPABASE_URL"])
          html = html.replace("https://oalfzgluqroqbbrluhpr.supabase.co", os.environ["TEST_SUPABASE_URL"])
          html = html.replace("sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg", os.environ["TEST_SUPABASE_ANON_KEY"])
          if "oalfzgluqroqbbrulhpr.supabase.co" in html or "oalfzgluqroqbbrluhpr.supabase.co" in html or "sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg" in html:
              raise SystemExit("Safety failure: production Supabase config remains in test APK")
          if os.environ["TEST_SUPABASE_URL"] not in html or os.environ["TEST_SUPABASE_ANON_KEY"] not in html:
              raise SystemExit("Safety failure: EduPunch-Test config was not injected")
          path.write_text(html)
          print("PASS: test APK bundle targets EduPunch-Test only.")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Bundle native bridge
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild mobile/native-bridge.js --bundle --format=iife --platform=browser --target=es2020 --outfile=mobile/www/assets/vendor/ashiana-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          bridge = '  <script src="./assets/vendor/ashiana-native-bridge.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find the native bridge insertion point")
          path.write_text(html.replace(anchor, anchor + '\n' + bridge, 1))
          PY

      - name: Verify Capacitor environment
        run: npx cap doctor

      - name: Add Android platform
        run: npx cap add android

      - name: Declare Android camera permission for QR scanner
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in manifest:
              marker = '<manifest '
              if marker not in manifest:
                  raise SystemExit("Could not locate Android manifest root")
              end = manifest.find('>', manifest.find(marker)) + 1
              manifest = manifest[:end] + '\n    ' + permission + manifest[end:]
              path.write_text(manifest)
          if permission not in path.read_text():
              raise SystemExit("Camera permission was not added")
          print("PASS: Android manifest declares camera permission for QR scanning.")
          PY

      - name: Declare Android camera and location permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = path.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.CAMERA" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          marker = '<manifest '
          if marker not in manifest:
              raise SystemExit("Could not locate Android manifest root")
          end = manifest.find('>', manifest.find(marker)) + 1
          missing = [p for p in permissions if p not in manifest]
          if missing:
              manifest = manifest[:end] + '\n    ' + '\n    '.join(missing) + manifest[end:]
              path.write_text(manifest)
          actual = path.read_text()
          absent = [p for p in permissions if p not in actual]
          if absent:
              raise SystemExit("Missing Android permissions: " + ", ".join(absent))
          print("PASS: camera, coarse location, and precise location declared.")
          PY

      - name: Set unique test-only Admin application ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("capacitor.config.ts")
          source = path.read_text()
          old = 'admin: { appId: "com.ashianapublicschool.attendance.admin", appName: "Ashiana Admin" }'
          new = 'admin: { appId: "com.ashianapublicschool.attendance.admin.test", appName: "Ashiana Admin Test" }'
          if source.count(old) != 1:
              raise SystemExit("Expected Admin app ID mapping was not found exactly once")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ashiana-Admin-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: Ashiana-Admin-Test-APK
          path: Ashiana-Admin-Test.apk
          if-no-files-found: error
          retention-days: 7
