name: EduPunch-Test Student APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-edupunch-test-student:
    name: Build isolated EduPunch-Test Student APK
    runs-on: ubuntu-latest
    env:
      APP_ROLE: student
      TEST_SUPABASE_URL: https://goztsnvscanozcfjzwxy.supabase.co
      TEST_SUPABASE_ANON_KEY: sb_publishable_bLByB1N3ESh_5ncJ-yh3_Q_DkBpoGHh
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare student-only web bundle and force test backend
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/assets/vendor
          cp index.html mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor/. mobile/www/assets/vendor
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("mobile/www/index.html")
          html = path.read_text()
          role = os.environ["APP_ROLE"]
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find expected Supabase script insertion point")
          additions = anchor + '\\n  <script>try{const u=new URL(window.location.href);u.searchParams.set("login","' + role + '");history.replaceState(null,"",u.toString());}catch(e){}</script>'
          html = html.replace(anchor, additions, 1)

          # Replace every known production Supabase endpoint/key in this build copy only.
          html = html.replace("https://oalfzgluqroqbbrulhpr.supabase.co", os.environ["TEST_SUPABASE_URL"])
          html = html.replace("sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg", os.environ["TEST_SUPABASE_ANON_KEY"])
          if "oalfzgluqroqbbrulhpr.supabase.co" in html or "sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg" in html:
              raise SystemExit("Safety check failed: production Supabase configuration remains in test APK bundle")
          if os.environ["TEST_SUPABASE_URL"] not in html or os.environ["TEST_SUPABASE_ANON_KEY"] not in html:
              raise SystemExit("Safety check failed: EduPunch-Test Supabase configuration was not injected")
          path.write_text(html)
          print("Safety check passed: student APK bundle targets EduPunch-Test only.")
          PY
          test -s mobile/www/assets/vendor/supabase.js

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Bundle Android native bridge
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild mobile/native-bridge.js --bundle --format=iife --platform=browser --target=es2020 --outfile=mobile/www/assets/vendor/ashiana-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          bridge = '  <script src="./assets/vendor/ashiana-native-bridge.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find expected script insertion point")
          path.write_text(html.replace(anchor, anchor + '\\n' + bridge, 1))
          PY

      - name: Verify Capacitor environment
        run: npx cap doctor

      - name: Add Android platform
        run: npx cap add android

      - name: Configure Firebase Cloud Messaging
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON is required for this isolated notification test. No APK will be built."
            exit 1
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          project_id = config.get("project_info", {}).get("project_id")
          package_names = {
              item.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for item in config.get("client", [])
          }
          if not project_id:
              raise SystemExit("Firebase config is missing project_info.project_id")
          if "com.ashianapublicschool.attendance.student" not in package_names:
              raise SystemExit("Firebase config does not include the student APK package name")
          print("Firebase config validated for the student package.")
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              match = re.search(r"buildscript\\s*\\{[\\s\\S]*?dependencies\\s*\\{", root_text)
              if not match:
                  raise SystemExit("Could not find Android buildscript dependencies block")
              root_text = root_text[:match.end()] + "\\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[match.end():]
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text.rstrip() + "\\n\\napply plugin: 'com.google.gms.google-services'\\n")
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk EduPunch-Test-Student-APK.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: EduPunch-Test-Student-APK
          path: EduPunch-Test-Student-APK.apk
          if-no-files-found: error
          retention-days: 7
