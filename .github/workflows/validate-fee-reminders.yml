name: Fee Reminder Function Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/fee-reminders/**"
      - ".github/workflows/validate-fee-reminders.yml"

permissions:
  contents: read

jobs:
  type-check-fee-reminders:
    name: Type-check fee-reminders Edge Function
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check fee-reminders Edge Function
        run: deno check supabase/functions/fee-reminders/index.ts
