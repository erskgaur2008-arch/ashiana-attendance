name: Staff Geofence Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-staff-geofence-test:
    name: Build isolated Staff geofence test APK
    runs-on: ubuntu-latest
    env:
      APP_ROLE: staff
      TEST_SUPABASE_URL: https://goztsnvscanozcfjzwxy.supabase.co
      TEST_SUPABASE_ANON_KEY: sb_publishable_bLByB1N3ESh_5ncJ-yh3_Q_DkBpoGHh
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Prepare isolated test web bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf mobile/www
          mkdir -p mobile/www/assets/vendor
          cp index.html mobile/www/
          cp ios-pwa.css mobile/www/
          cp manifest.webmanifest mobile/www/
          cp sw.js mobile/www/
          cp "logo 2.png" mobile/www/
          cp -R assets/vendor/. mobile/www/assets/vendor
          python3 - <<'PY'
          import os
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find the expected Supabase script anchor")
          role_script = '<script>try{const u=new URL(window.location.href);u.searchParams.set("login","staff");history.replaceState(null,"",u.toString());}catch(e){}</script>'
          html = html.replace(anchor, anchor + '\n' + role_script, 1)
          html = html.replace("https://oalfzgluqroqbbrluhpr.supabase.co", os.environ["TEST_SUPABASE_URL"])
          html = html.replace("sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg", os.environ["TEST_SUPABASE_ANON_KEY"])
          if "oalfzgluqroqbbrluhpr.supabase.co" in html or "sb_publishable_PND9f9FKbNrxlEakSgLKYA_5EsqLHkg" in html:
              raise SystemExit("Safety failure: production Supabase config remains in test APK")
          if os.environ["TEST_SUPABASE_URL"] not in html or os.environ["TEST_SUPABASE_ANON_KEY"] not in html:
              raise SystemExit("Safety failure: EduPunch-Test config was not injected")
          path.write_text(html)
          print("PASS: test APK bundle targets EduPunch-Test only.")
          PY

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          npm ci --no-audit --no-fund

      - name: Bundle native bridge
        shell: bash
        run: |
          set -euo pipefail
          npx esbuild mobile/native-bridge.js --bundle --format=iife --platform=browser --target=es2020 --outfile=mobile/www/assets/vendor/ashiana-native-bridge.js
          python3 - <<'PY'
          from pathlib import Path
          path = Path("mobile/www/index.html")
          html = path.read_text()
          anchor = '  <script src="./assets/vendor/supabase.js"></script>'
          bridge = '  <script src="./assets/vendor/ashiana-native-bridge.js"></script>'
          if html.count(anchor) != 1:
              raise SystemExit("Could not find the native bridge insertion point")
          path.write_text(html.replace(anchor, anchor + '\n' + bridge, 1))
          PY

      - name: Verify Capacitor environment
        run: npx cap doctor

      - name: Add Android platform
        run: npx cap add android

      - name: Set unique test-only Staff application ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("capacitor.config.ts")
          source = path.read_text()
          old = 'staff: { appId: "com.ashianapublicschool.attendance.staff", appName: "Ashiana Staff" }'
          new = 'staff: { appId: "com.ashianapublicschool.attendance.staff.test", appName: "Ashiana Staff Test" }'
          if source.count(old) != 1:
              raise SystemExit("Expected Staff app ID mapping was not found exactly once")
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Configure Firebase when a test package is available
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${GOOGLE_SERVICES_JSON}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is absent; this test APK will build without push-notification registration."
            exit 0
          fi
          printf '%s' "${GOOGLE_SERVICES_JSON}" > android/app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("android/app/google-services.json").read_text())
          packages = {c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in config.get("client", [])}
          if "com.ashianapublicschool.attendance.staff.test" not in packages:
              raise SystemExit("Firebase config does not include the staff.test package; add it before testing push notifications.")
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              import re
              match = re.search(r"buildscript\s*\{[\s\S]*?dependencies\s*\{", root_text)
              if not match: raise SystemExit("Could not find Android buildscript dependencies block")
              root.write_text(root_text[:match.end()] + "\n        classpath 'com.google.gms:google-services:4.4.2'" + root_text[match.end():])
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n")
          PY

      - name: Sync Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename test APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Ashiana-Staff-Geofence-Test.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v6
        with:
          name: Ashiana-Staff-Geofence-Test-APK
          path: Ashiana-Staff-Geofence-Test.apk
          if-no-files-found: error
          retention-days: 7
