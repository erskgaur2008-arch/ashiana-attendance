name: Deploy Push Notifications Edge Function

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type DEPLOY to deploy to the production Supabase project"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-push-notifications-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirm_production == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Validate deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "Missing SUPABASE_PROJECT_ID"; exit 1; }
          echo "Deployment credentials are configured."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy push-notifications function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase functions deploy push-notifications --project-ref "$SUPABASE_PROJECT_ID" --no-verify-jwt
