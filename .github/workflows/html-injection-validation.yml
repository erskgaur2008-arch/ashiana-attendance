name: HTML Injection Boundary Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/html-injection-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  html-injection-boundaries:
    name: Check dynamic HTML safety guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify calendar delete handler escapes data in HTML attribute context
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const fail = (message) => { console.error(message); process.exit(1); };
          const safe = 'onclick="deleteAdminStudentPortalCalendarTopic(\'+studentEscape(JSON.stringify(x.ids))+\')"';
          const unsafe = 'onclick="deleteAdminStudentPortalCalendarTopic(\'+JSON.stringify(x.ids)+\')"';
          if (!html.includes(safe)) fail('Calendar topic ID array must be HTML-escaped before insertion into the inline handler attribute.');
          if (html.includes(unsafe)) fail('Found the unsafe calendar topic delete handler.');
          if (!html.includes("function studentEscape(v){return String(v??'' ).replace(/[&<>") &&
              !html.includes("function studentEscape(v){return String(v??'').replace(/[&<>")) {
            fail('Expected studentEscape HTML-escaping helper is missing or changed.');
          }
          const requiredEscapes = [
            "${studentEscape(item.firstIn || '--:--')}",
            "${studentEscape(item.lastOut || '--:--')}",
            "${studentEscape(p.type)} ${studentEscape(p.timestamp)}",
            "${studentEscape(item.leaveType || 'Approved Absence')}"
          ];
          for (const expression of requiredEscapes) {
            if (!html.includes(expression)) fail('Missing HTML escaping in staff history card: ' + expression);
          }
          for (const expression of [
            "${item.firstIn || '--:--'}",
            "${item.lastOut || '--:--'}",
            "${p.type} ${p.timestamp}",
            "${item.leaveType || 'Approved Absence'}"
          ]) {
            if (html.includes(expression)) fail('Found unescaped staff history card value: ' + expression);
          }
          console.log('HTML attribute and staff history escaping checks passed.');
          NODE
